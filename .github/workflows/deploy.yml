name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5.0.0
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Refresh release manifest
        run: |
          curl --fail --silent --show-error --retry 3 \
            https://lingo-1259551686.cos.ap-shanghai.myqcloud.com/releases/latest-web.json \
            --output public/releases/latest-web.json
          node -e "JSON.parse(require('node:fs').readFileSync('public/releases/latest-web.json', 'utf8'))"

      - name: Build site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
